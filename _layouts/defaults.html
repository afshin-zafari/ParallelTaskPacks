
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>

    <script>
        window.MathJax = {
        tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
        };
    </script>
    <script async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
</head>


<body>
    <main>
        {{ content }}
    </main>


    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

        mermaid.initialize({startOnLoad: true });
        // Manually find and render mermaid code blocks on load
  document.addEventListener("DOMContentLoaded", async () => {
    const blocks = document.querySelectorAll("code.language-mermaid, pre.mermaid");
    if (blocks.length > 0) {
      // If code.language-mermaid is used, mermaid usually prefers rendering 
      // the parent <pre> tag or converting the block text directly.
      blocks.forEach((block, index) => {
        const content = block.textContent;
        const wrapper = document.createElement("div");
        wrapper.className = "mermaid";
        wrapper.textContent = content;
        block.closest("pre")?.replaceWith(wrapper) || block.replaceWith(wrapper);
      });
      await mermaid.run({ nodes: document.querySelectorAll(".mermaid") });
    }
  });
    </script>
</body>
</html>
